plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.hyunu'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// PasswordEncoder
	implementation 'org.springframework.security:spring-security-crypto'

	// H2
	runtimeOnly 'com.h2database:h2'

	// H2 Console (local development)
	developmentOnly 'org.springframework.boot:spring-boot-h2console'

	//PostgreSQL Driver
	runtimeOnly 'org.postgresql:postgresql'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	maxParallelForks = 1

	// H2 인덱스 실행계획 성능 실험 테스트는 일반 회귀 테스트에서 제외
	exclude '**/ReservationIndexPerformanceTest.class'
}

// CI 전용 Gradle Task
tasks.register('ciTest', Test) {
	description = 'Runs tests for CI excluding PostgreSQL performance experiments.'
	group = 'verification'

	// 기본 test SourceSet의 컴파일 결과 및 의존성 사용
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath

	// JUnit 5
	useJUnitPlatform()

	// CI 환경의 테스트 실행 안정성
	maxParallelForks = 1

	// CI에서 실행하지 않을 DB 및 성능 실험 테스트
	exclude '**/PostgreSqlSchemaTest.class'
	exclude '**/ReservationPostgreSqlIndexPerformanceTest.class'
	exclude '**/ReservationPaginationPerformanceTest.class'
	exclude '**/ReservationIndexPerformanceTest.class'

	// 테스트 결과를 로그에 표시
	testLogging {
		events 'passed', 'skipped', 'failed'

		exceptionFormat = 'full'
	}
}
