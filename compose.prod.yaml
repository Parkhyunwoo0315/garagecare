services:
  app:
    build:
      context: .
    image: garagecare:prod
    container_name: garagecare-app

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    ports:
      - "8080:8080"

    restart: unless-stopped