spring.application.name=garagecare-pgtest

spring.datasource.url=${GARAGECARE_PG_TEST_URL}
spring.datasource.username=${GARAGECARE_PG_TEST_USER}
spring.datasource.password=${GARAGECARE_PG_TEST_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=false