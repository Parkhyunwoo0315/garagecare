
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="동부자동차공업사 고객 마이페이지">

    <title>마이페이지 | 동부자동차공업사</title>

    <link rel="stylesheet"
          th:href="@{/css/common.css}">

    <link rel="stylesheet"
          th:href="@{/css/mypage.css}">
</head>

<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main id="main-content">

    <section class="mypage-section">
        <div class="container">

            <div class="mypage-heading">
                <span class="mypage-eyebrow">
                    MY PAGE
                </span>

                <h1>마이페이지</h1>

                <p>
                    등록한 차량과 정비 예약을
                    한곳에서 관리하세요.
                </p>
            </div>

            <section class="mypage-summary"
                     aria-label="나의 이용 현황">

                <div class="mypage-stat">

                    <span class="mypage-stat-label">
                        등록된 차량
                    </span>

                    <div class="mypage-stat-value">
                        <strong th:text="${vehicleCount}">0</strong>
                        <span>대</span>
                    </div>

                    <a th:href="@{/vehicles}">
                        내 차량 관리
                    </a>

                </div>

                <div class="mypage-stat">

                    <span class="mypage-stat-label">
                        총 정비 예약
                    </span>

                    <div class="mypage-stat-value">
                        <strong th:text="${reservationCount}">0</strong>
                        <span>건</span>
                    </div>

                    <a th:href="@{/reservations}">
                        예약 내역 확인
                    </a>

                </div>

            </section>

            <div class="mypage-grid">

                <section class="mypage-card"
                         aria-labelledby="vehicle-title">

                    <div class="mypage-card-header">
                        <span class="mypage-card-number">
                            01
                        </span>

                        <h2 id="vehicle-title">
                            내 차량 관리
                        </h2>
                    </div>

                    <p>
                        등록한 차량을 확인하거나
                        새로운 차량을 등록할 수 있습니다.
                    </p>

                    <div class="mypage-card-actions">
                        <a class="mypage-button primary"
                           th:href="@{/vehicles}">
                            내 차량 보기
                        </a>

                        <a class="mypage-button secondary"
                           th:href="@{/vehicles/new}">
                            차량 등록
                        </a>
                    </div>
                </section>

                <section class="mypage-card"
                         aria-labelledby="reservation-title">

                    <div class="mypage-card-header">
                        <span class="mypage-card-number">
                            02
                        </span>

                        <h2 id="reservation-title">
                            정비 예약 관리
                        </h2>
                    </div>

                    <p>
                        정비 예약을 신청하고
                        기존 예약의 진행 상태를 확인하세요.
                    </p>

                    <div class="mypage-card-actions">
                        <a class="mypage-button primary"
                           th:href="@{/reservations}">
                            내 예약 보기
                        </a>

                        <a class="mypage-button secondary"
                           th:href="@{/reservations/new}">
                            정비 예약 신청
                        </a>
                    </div>
                </section>

            </div>

            <div class="mypage-bottom">
                <a th:href="@{/}">
                    ← 메인 페이지로 돌아가기
                </a>
            </div>

        </div>
    </section>

</main>

    <div th:replace="~{fragments/footer :: siteFooter}"></div>

</body>
</html>
