<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>회원 관리 | GarageCare</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
      font-family: Arial, sans-serif;
    }

    .container {
      width: min(1100px, calc(100% - 40px));
      margin: 50px auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .member-count {
      color: #6b7280;
      font-size: 14px;
    }

    .table-wrapper {
      overflow: hidden;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 16px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      background: #f9fafb;
      color: #4b5563;
      font-size: 13px;
      font-weight: 700;
    }

    td {
      font-size: 14px;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: #f9fafb;
    }

    .member-link {
      color: #111827;
      font-weight: 700;
      text-decoration: none;
    }

    .member-link:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge-admin {
      background: #ede9fe;
      color: #6d28d9;
    }

    .badge-member {
      background: #e0f2fe;
      color: #0369a1;
    }

    .badge-active {
      background: #dcfce7;
      color: #15803d;
    }

    .badge-inactive {
      background: #fee2e2;
      color: #b91c1c;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: #6b7280;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
    }

    .page-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 38px;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: white;
      color: #111827;
      text-decoration: none;
      font-size: 14px;
    }

    .page-link:hover {
      background: #f9fafb;
    }

    .page-info {
      color: #6b7280;
      font-size: 14px;
    }
  </style>
</head>

<body>

<main class="container">

  <div class="header">
    <h1>회원 관리</h1>

    <span class="member-count"
          th:text="|전체 ${members.totalElements}명|">
      전체 0명
    </span>
  </div>

  <div class="table-wrapper"
       th:if="${!members.empty}">

    <table>
      <thead>
      <tr>
        <th>ID</th>
        <th>이름</th>
        <th>이메일</th>
        <th>권한</th>
        <th>상태</th>
      </tr>
      </thead>

      <tbody>
      <tr th:each="member : ${members.content}">

        <td th:text="${member.memberId}">
          1
        </td>

        <td>
          <a class="member-link"
             th:href="@{/admin/members/{id}(id=${member.memberId})}"
             th:text="${member.name}">
            회원 이름
          </a>
        </td>

        <td th:text="${member.email}">
          member@example.com
        </td>

        <td>
          <span class="badge badge-admin"
                th:if="${member.role.name() == 'ADMIN'}">
            ADMIN
          </span>

          <span class="badge badge-member"
                th:if="${member.role.name() == 'MEMBER'}">
            MEMBER
          </span>
        </td>

        <td>
          <span class="badge badge-active"
                th:if="${member.active}">
            활성
          </span>

          <span class="badge badge-inactive"
                th:unless="${member.active}">
            비활성
          </span>
        </td>

      </tr>
      </tbody>
    </table>

  </div>

  <div class="table-wrapper"
       th:if="${members.empty}">

    <div class="empty">
      등록된 회원이 없습니다.
    </div>

  </div>

  <div class="pagination"
       th:if="${members.totalPages > 1}">

    <a class="page-link"
       th:if="${members.hasPrevious()}"
       th:href="@{/admin/members(page=${members.number - 1})}">
      이전
    </a>

    <span class="page-info"
          th:text="|${members.number + 1} / ${members.totalPages}|">
      1 / 1
    </span>

    <a class="page-link"
       th:if="${members.hasNext()}"
       th:href="@{/admin/members(page=${members.number + 1})}">
      다음
    </a>

  </div>

</main>

</body>
</html>
