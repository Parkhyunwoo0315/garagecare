<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>예약 상세 | GarageCare</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 40px 20px;
        background: #f5f6f8;
        color: #1f2937;
        font-family: Arial, sans-serif;
    }

    .container {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
    }

    h1 {
        margin: 0;
    }

    .back-link {
        color: #374151;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
    }

    .back-link:hover {
        text-decoration: underline;
    }

    .section {
        margin-bottom: 20px;
        padding: 24px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: white;
    }

    .section h2 {
        margin: 0 0 20px;
        font-size: 18px;
    }

    .info-grid {
        display: grid;
        grid-template-columns: 160px 1fr;
        row-gap: 14px;
    }

    .label {
        color: #6b7280;
        font-size: 14px;
        font-weight: 700;
    }

    .value {
        font-size: 14px;
    }

    .status {
        display: inline-block;
        padding: 5px 9px;
        border-radius: 6px;
        background: #f3f4f6;
        font-size: 12px;
        font-weight: 700;
    }

    .maintenance-list {
        margin: 0;
        padding: 0;
        list-style: none;
    }

    .maintenance-item {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 14px 0;
        border-bottom: 1px solid #e5e7eb;
    }

    .maintenance-item:first-child {
        padding-top: 0;
    }

    .maintenance-item:last-child {
        padding-bottom: 0;
        border-bottom: none;
    }

    .maintenance-name {
        font-weight: 700;
    }

    .price {
        color: #4b5563;
    }
  </style>
</head>

<body>

<main class="container">

  <div class="header">
    <h1>예약 상세</h1>

    <a class="back-link"
       th:href="@{/admin/reservations}">
      예약 목록으로
    </a>
  </div>

  <section class="section">
    <h2>예약 정보</h2>

    <div class="info-grid">

      <div class="label">예약 ID</div>
      <div class="value"
           th:text="${reservation.reservationId}">
        1
      </div>

      <div class="label">예약 날짜</div>
      <div class="value"
           th:text="${reservation.reservationDate}">
        2026-09-25
      </div>

      <div class="label">예약 시간</div>
      <div class="value"
           th:text="${reservation.reservationTime}">
        14:00
      </div>

      <div class="label">상태</div>
      <div class="value">
        <span class="status"
              th:text="${reservation.status}">
          PENDING
        </span>
      </div>

    </div>
  </section>

  <section class="section">
    <h2>예약자 정보</h2>

    <div class="info-grid">

      <div class="label">이름</div>
      <div class="value"
           th:text="${reservation.memberName}">
        홍길동
      </div>

      <div class="label">이메일</div>
      <div class="value"
           th:text="${reservation.memberEmail}">
        member@example.com
      </div>

    </div>
  </section>

  <section class="section">
    <h2>차량 정보</h2>

    <div class="info-grid">

      <div class="label">차량번호</div>
      <div class="value"
           th:text="${reservation.vehicleNumber}">
        12가3456
      </div>

      <div class="label">제조사</div>
      <div class="value"
           th:text="${reservation.manufacturer}">
        Mercedes-Benz
      </div>

      <div class="label">모델</div>
      <div class="value"
           th:text="${reservation.model}">
        E350
      </div>

      <div class="label">연식</div>
      <div class="value"
           th:text="${reservation.modelYear}">
        2013
      </div>

    </div>
  </section>

  <section class="section">
    <h2>정비 항목</h2>

    <ul class="maintenance-list">

      <li class="maintenance-item"
          th:each="item : ${reservation.maintenanceItems}">

        <span class="maintenance-name"
              th:text="${item.name}">
          엔진오일 교환
        </span>

        <span class="price"
              th:text="${item.estimatedPrice != null
                ? #numbers.formatInteger(item.estimatedPrice, 3, 'COMMA') + '원'
                : '가격 미정'}">
          70,000원
        </span>

      </li>

    </ul>
  </section>

</main>

</body>
</html>
