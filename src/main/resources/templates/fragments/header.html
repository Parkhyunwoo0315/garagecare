<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<header th:fragment="siteHeader" class="site-header">

    <div class="topbar">
        <div class="container topbar-inner">
            <span>동부자동차공업사 · 자동차 정비 및 점검</span>

            <div class="topbar-contact">
                <a href="tel:0226826264">
                    가게 전화 02-2682-6264
                </a>
                <a href="tel:01052738889">
                    상담 전화 010-5273-8889
                </a>
            </div>
        </div>
    </div>

    <div class="container header-inner">

        <a class="brand" th:href="@{/}" aria-label="동부자동차공업사 홈">
            <span class="brand-symbol" aria-hidden="true">⚙</span>
            <span class="brand-copy">
                <strong>동부자동차공업사</strong>
                <small>자동차 정비 · 점검 · 수리</small>
            </span>
        </a>

        <nav class="primary-nav" aria-label="주 메뉴">
            <ul class="nav-list">
                <li><a th:href="@{/#services}">정비 서비스</a></li>
                <li><a th:href="@{/#process}">이용 안내</a></li>
                <li><a th:href="@{/#location}">오시는 길</a></li>
                <li><a th:href="@{/#notices}">공지사항</a></li>
                <li th:if="${loggedIn}">
                    <a th:href="@{/reservations}">내 예약</a>
                </li>
            </ul>
        </nav>

        <div class="header-actions" th:unless="${loggedIn}">
            <a class="header-login" th:href="@{/members/login}">
                로그인
            </a>
            <a class="header-signup" th:href="@{/members/signup}">
                회원가입
            </a>
        </div>

        <div class="header-actions" th:if="${loggedIn}">
            <a class="header-login" th:href="@{/vehicles}">
                내 차량
            </a>

            <form th:action="@{/members/logout}" method="post">
                <button type="submit" class="header-logout">
                    로그아웃
                </button>
            </form>
        </div>

    </div>

</header>

</body>
</html>
