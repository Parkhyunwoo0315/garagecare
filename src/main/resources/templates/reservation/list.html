<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>내 예약 | GarageCare</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 40px 20px;
        background: #f5f6f8;
        color: #1f2937;
        font-family: Arial, sans-serif;
    }

    .container {
        width: 100%;
        max-width: 820px;
        margin: 0 auto;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
    }

    h1 {
        margin: 0;
    }

    .new-button {
        padding: 11px 18px;
        border-radius: 8px;
        background: #111827;
        color: white;
        text-decoration: none;
        font-weight: 700;
    }

    .reservation-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    .reservation-card {
        display: block;
        padding: 22px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: white;
        color: inherit;
        text-decoration: none;
    }

    .reservation-card:hover {
        border-color: #9ca3af;
    }

    .card-top {
        display: flex;
        justify-content: space-between;
        margin-bottom: 14px;
    }

    .vehicle {
        font-weight: 700;
    }

    .status {
        font-size: 13px;
        font-weight: 700;
    }

    .date {
        color: #6b7280;
        font-size: 14px;
    }

    .empty-state {
        padding: 50px 20px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: white;
        text-align: center;
    }

    .empty-state p {
        margin: 0 0 20px;
        color: #6b7280;
    }
  </style>
</head>

<body>

<main class="container">

  <div class="header">

    <h1>내 예약</h1>

    <a th:href="@{/reservations/new}"
       class="new-button">
      새 예약
    </a>

  </div>

  <div class="empty-state"
       th:if="${#lists.isEmpty(reservations)}">

    <p>
      아직 등록된 예약이 없습니다.
    </p>

    <a th:href="@{/reservations/new}"
       class="new-button">
      첫 예약 등록하기
    </a>

  </div>

  <div class="reservation-list"
       th:unless="${#lists.isEmpty(reservations)}">

    <a class="reservation-card"
       th:each="reservation : ${reservations}"
       th:href="@{/reservations/{id}(id=${reservation.reservationId})}">

      <div class="card-top">

                <span class="vehicle"
                      th:text="${reservation.vehicleNumber}">
                    12가3456
                </span>

        <span class="status"
              th:text="${reservation.status}">
                    PENDING
                </span>

      </div>

      <div class="date">

                <span th:text="${reservation.reservationDate}">
                    2026-08-20
                </span>

        <span th:text="${reservation.reservationTime}">
                    14:00
                </span>

      </div>

    </a>

  </div>

</main>

</body>
</html>
