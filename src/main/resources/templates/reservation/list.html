
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="동부자동차공업사 정비 예약 내역">

    <title>내 예약 | 동부자동차공업사</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/reservation.css}">
</head>

<body>

<div th:replace="~{fragments/header :: siteHeader}"></div>

<main id="main-content"
      class="reservation-page reservation-history-page">

    <div class="container">

        <!-- 페이지 상단 -->
        <header class="reservation-intro">

            <nav class="reservation-breadcrumb"
                 aria-label="현재 위치">

                <a th:href="@{/mypage}">마이페이지</a>
                <span aria-hidden="true">/</span>
                <strong aria-current="page">내 예약</strong>

            </nav>

            <div class="reservation-history-heading">

                <div>
                    <h1>내 정비 예약</h1>
                    <p>
                        신청한 정비 예약과 진행 상태를
                        확인할 수 있습니다.
                    </p>
                </div>

                <a th:href="@{/reservations/new}"
                   class="reservation-action-primary">
                    + 정비 예약 신청
                </a>

            </div>

        </header>

        <!-- 전체 예약 현황 -->
        <section class="reservation-history-summary"
                 aria-label="예약 현황">

            <div class="reservation-history-summary-icon"
                 aria-hidden="true">
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <rect x="3" y="5"
                          width="18" height="16" rx="2"/>
                    <path d="M7 3v4M17 3v4M3 10h18"/>
                    <path d="m9 16 2 2 4-4"/>
                </svg>
            </div>

            <div>
                <span>전체 예약 내역</span>
                <strong>
                    <span th:text="${reservations.totalElements}">0</span>
                    건
                </strong>
            </div>

        </section>

        <!-- 예약이 없는 경우 -->
        <section class="reservation-history-empty"
                 th:if="${reservations.totalElements == 0}">

            <div class="reservation-history-empty-icon"
                 aria-hidden="true">
                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8"
                     stroke-linecap="round"
                     stroke-linejoin="round">
                    <rect x="3" y="5"
                          width="18" height="16" rx="2"/>
                    <path d="M7 3v4M17 3v4M3 10h18"/>
                    <path d="M8 15h8"/>
                </svg>
            </div>

            <h2>아직 예약 내역이 없습니다.</h2>

            <p>
                필요한 정비 항목과 방문 희망 일정을
                선택하여 첫 예약을 신청해 보세요.
            </p>

            <a th:href="@{/reservations/new}"
               class="reservation-action-primary">
                정비 예약 신청하기
            </a>

        </section>

        <!-- 예약 목록 -->
        <section class="reservation-history-section"
                 th:if="${reservations.totalElements > 0}"
                 aria-labelledby="history-title">

            <h2 id="history-title">
                예약 내역
            </h2>

            <div class="reservation-history-list">

                <article class="reservation-history-card"
                         th:each="item : ${reservations.content}">

                    <div class="reservation-history-card-top">

                        <span class="reservation-history-number"
                              th:text="|예약번호 #${item.reservationId}|">
                            예약번호
                        </span>

                        <span class="reservation-status"
                              th:classappend="|reservation-state-${item.status.name()}|">

                            <span th:switch="${item.status.name()}">
                                <span th:case="'PENDING'">예약 대기</span>
                                <span th:case="'CONFIRMED'">예약 확정</span>
                                <span th:case="'COMPLETED'">정비 완료</span>
                                <span th:case="'CANCELED'">예약 취소</span>
                                <span th:case="*"
                                      th:text="${item.status}">상태</span>
                            </span>

                        </span>

                    </div>

                    <div class="reservation-history-card-body">

                        <h3 th:text="${item.vehicleNumber}">
                            차량번호
                        </h3>

                        <dl class="reservation-history-info">

                            <div>
                                <dt>예약 날짜</dt>
                                <dd th:text="${#temporals.format(
                                    item.reservationDate, 'yyyy.MM.dd'
                                )}">
                                    2026.11.19
                                </dd>
                            </div>

                            <div>
                                <dt>예약 시간</dt>
                                <dd th:text="${#temporals.format(
                                    item.reservationTime, 'HH:mm'
                                )}">
                                    14:00
                                </dd>
                            </div>

                        </dl>

                    </div>

                    <div class="reservation-history-card-bottom">

                        <a th:href="@{/reservations/{id}(
                                id=${item.reservationId}
                            )}"
                           class="reservation-action-secondary">
                            예약 상세 보기
                        </a>

                    </div>

                </article>

            </div>

            <!-- 조회 페이지 범위를 벗어난 경우 -->
            <p class="reservation-history-no-page"
               th:if="${reservations.empty}">
                해당 페이지에 표시할 예약이 없습니다.
            </p>

            <!-- 페이지 이동 -->
            <nav class="reservation-pagination"
                 th:if="${reservations.totalPages > 1}"
                 aria-label="예약 내역 페이지">

                <a th:if="${reservations.hasPrevious()}"
                   th:href="@{/reservations(
                       page=${reservations.number - 1}
                   )}">
                    이전
                </a>

                <span>
                    <strong th:text="${reservations.number + 1}">1</strong>
                    /
                    <span th:text="${reservations.totalPages}">1</span>
                </span>

                <a th:if="${reservations.hasNext()}"
                   th:href="@{/reservations(
                       page=${reservations.number + 1}
                   )}">
                    다음
                </a>

            </nav>

        </section>

        <!-- 마이페이지 복귀 -->
        <div class="reservation-return">
            <a th:href="@{/mypage}">
                <span aria-hidden="true">←</span>
                마이페이지로 돌아가기
            </a>
        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: siteFooter}"></div>

</body>
</html>
