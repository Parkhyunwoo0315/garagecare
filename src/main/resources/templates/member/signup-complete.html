
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="동부자동차공업사 회원가입 완료">

    <title>회원가입 완료 | 동부자동차공업사</title>

    <link rel="stylesheet"
          th:href="@{/css/member-auth.css}">
</head>

<body class="auth-body">

<main id="main-content" class="auth-page">

    <section class="auth-card auth-complete"
             aria-labelledby="complete-title">

        <!-- 브랜드 -->
        <a th:href="@{/}"
           class="auth-brand"
           aria-label="동부자동차공업사 홈페이지">

            <span class="auth-brand-icon" aria-hidden="true">
                <img th:src="@{/images/garagecare-mark.png}"
                     alt=""
                     width="58"
                     height="58">
            </span>

            <span class="auth-brand-text">

                <strong class="auth-brand-name">
                    동부자동차공업사
                </strong>

                <small class="auth-brand-description">
                    자동차 정비 · 점검 · 수리
                </small>

            </span>

        </a>

        <!-- 가입 완료 아이콘 -->
        <div class="auth-complete-icon"
             aria-hidden="true">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2.2"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M20 7L10 17L4 11"/>

            </svg>

        </div>

        <!-- 완료 메시지 -->
        <h1 id="complete-title">
            회원가입이 완료되었습니다
        </h1>

        <p class="auth-complete-message">
            동부자동차공업사에 가입해 주셔서 감사합니다.
            <br>
            이제 로그인하여 차량을 등록하고
            <br>
            정비 예약 서비스를 이용할 수 있습니다.
        </p>

        <!-- 이용 안내 -->
        <div class="auth-complete-note">

            <strong>다음 단계</strong>
            <br>

            로그인 후 마이페이지에서 차량을 등록하고
            필요한 정비 항목과 방문 희망 일정을
            선택해 주세요.

        </div>

        <!-- 이동 버튼 -->
        <div class="auth-complete-actions">

            <a class="auth-button auth-button-primary"
               th:href="@{/members/login}">

                로그인하기

            </a>

            <a class="auth-button auth-button-secondary"
               th:href="@{/}">

                홈페이지로 이동

            </a>

        </div>

    </section>

</main>

</body>
</html>
