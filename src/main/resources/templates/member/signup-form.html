
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="동부자동차공업사 정비 예약 서비스 회원가입">

    <title>회원가입 | 동부자동차공업사</title>

    <link rel="stylesheet"
          th:href="@{/css/member-auth.css}">
</head>

<body class="auth-body">

<main id="main-content" class="auth-page">

    <section class="auth-card"
             aria-labelledby="signup-title">

        <!-- 브랜드 -->
        <a th:href="@{/}"
           class="auth-brand"
           aria-label="동부자동차공업사 홈페이지">

            <span class="auth-brand-icon" aria-hidden="true">
                <img th:src="@{/images/garagecare-mark.png}"
                    alt=""
                    width="58"
                    height="58">
            </span>

            <span class="auth-brand-text">

                <strong class="auth-brand-name">
                    동부자동차공업사
                </strong>

                <small class="auth-brand-description">
                    자동차 정비 · 점검 · 수리
                </small>

            </span>

        </a>

        <!-- 제목 -->
        <header class="auth-heading">

            <h1 id="signup-title">
                회원가입
            </h1>

            <p>
                차량을 등록하고 정비 예약을 관리할<br>
                계정을 만들어 주세요.
            </p>

        </header>

        <!-- 회원가입 폼 -->
        <form th:action="@{/members/signup}"
              th:object="${form}"
              method="post"
              class="auth-form"
              novalidate>

            <!-- 전역 오류 -->
            <div class="auth-global-error"
                 th:if="${#fields.hasGlobalErrors()}"
                 role="alert">

                <strong>
                    회원가입을 완료하지 못했습니다.
                </strong>

                <p th:each="error : ${#fields.globalErrors()}"
                   th:text="${error}">
                    회원가입 처리 중 오류가 발생했습니다.
                </p>

            </div>

            <!-- 이름 -->
            <div class="auth-field">

                <label class="auth-label">

                    <span class="auth-label-text">
                        이름
                    </span>

                    <input type="text"
                           th:field="*{name}"
                           class="auth-input"
                           th:errorclass="is-invalid"
                           th:attr="aria-invalid=${#fields.hasErrors('name')}"
                           placeholder="이름을 입력해 주세요"
                           autocomplete="name">

                </label>

                <p class="auth-field-error"
                   th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}"
                   role="alert">
                    이름 오류 메시지
                </p>

            </div>


            <!-- 이메일 -->
            <div class="auth-field">

                <label class="auth-label">

                    <span class="auth-label-text">
                        이메일
                    </span>

                    <input type="email"
                           th:field="*{email}"
                           class="auth-input"
                           th:errorclass="is-invalid"
                           th:attr="aria-invalid=${#fields.hasErrors('email')}"
                           placeholder="example@garagecare.com"
                           autocomplete="email">

                </label>

                <!-- 이메일 오류 메시지 -->
                <p class="auth-field-error"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}"
                   role="alert">
                    이메일 오류 메시지
                </p>

            </div>

            <!-- 비밀번호 -->
            <div class="auth-field">

                <label class="auth-label">

                    <span class="auth-label-text">
                        비밀번호
                    </span>

                    <input type="password"
                           th:field="*{password}"
                           class="auth-input"
                           th:errorclass="is-invalid"
                           th:attr="aria-invalid=${#fields.hasErrors('password')}"
                           placeholder="8자 이상 입력해 주세요"
                           autocomplete="new-password">

                </label>

                <p class="auth-field-error"
                   th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}"
                   role="alert">
                    비밀번호 오류 메시지
                </p>

            </div>

            <!-- 회원가입 버튼 -->
            <button type="submit"
                    class="auth-button auth-button-primary">

                회원가입

            </button>

        </form>

        <!-- 로그인 이동 -->
        <p class="auth-switch">

            이미 계정이 있으신가요?

            <a th:href="@{/members/login}">
                로그인
            </a>

        </p>

    </section>

    <!-- 홈으로 돌아가기 -->
    <a th:href="@{/}"
       class="auth-home-link">

        <svg viewBox="0 0 24 24"
             fill="none"
             stroke="currentColor"
             stroke-width="2"
             stroke-linecap="round"
             stroke-linejoin="round"
             aria-hidden="true">

            <path d="M19 12H5"/>
            <path d="M12 19l-7-7 7-7"/>

        </svg>

        홈페이지로 돌아가기

    </a>

</main>

</body>
</html>
